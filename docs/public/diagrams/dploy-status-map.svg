<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Status and condition map across the three Dploy CRDs. A DployTemplate publishes one condition, SourceReady, which gates whether instances may apply a HelmRelease. A DployInstance moves Pending, Provisioning, then Ready for on-demand or Available and Claimed for pooled members, or Failed, and Expiring on teardown; it carries a Ready condition and a Health string. A DployInstanceClaim moves Pending to Bound, or to Rejected, and to Expired at the end of its TTL; it carries Bound and Ready conditions and mirrors the bound instance's phase and health. One gap remains marked: status.sync and status.extendCount are declared in the API and written by nobody.">
  <defs>
    <marker id="sm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="sm-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ============ DployTemplate ============ -->
  <rect x="20" y="20" width="360" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="46" fill="#0f172a" font-size="14" font-weight="700">DployTemplate</text>
  <text x="40" y="66" fill="#64748b" font-size="10.5">no phase — counters plus one condition</text>

  <text x="40" y="92" fill="#334155" font-size="11" font-weight="600">status</text>
  <text x="40" y="108" fill="#475569" font-size="10">poolAvailable · poolClaimed · poolTotal</text>
  <text x="40" y="122" fill="#475569" font-size="10">observedGeneration · conditions</text>

  <rect x="40" y="132" width="320" height="26" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="52" y="149" fill="#1e3a8a" font-size="10.5" font-weight="600">SourceReady</text>
  <text x="146" y="149" fill="#1e40af" font-size="9.5">True · False · (absent = not yet verified)</text>

  <!-- ============ DployInstance ============ -->
  <rect x="20" y="196" width="1200" height="264" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="222" fill="#0f172a" font-size="14" font-weight="700">DployInstance</text>
  <text x="152" y="222" fill="#64748b" font-size="10.5">phase · health · Ready condition</text>

  <rect x="40" y="248" width="104" height="38" rx="19" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="92" y="272" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">Pending</text>

  <rect x="184" y="248" width="126" height="38" rx="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="247" y="272" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="600">Provisioning</text>

  <rect x="392" y="248" width="100" height="38" rx="19" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="442" y="272" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">Ready</text>

  <rect x="392" y="326" width="110" height="38" rx="19" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="447" y="350" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">Available</text>

  <rect x="542" y="326" width="102" height="38" rx="19" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="593" y="350" text-anchor="middle" fill="#065f46" font-size="12" font-weight="600">Claimed</text>

  <rect x="184" y="404" width="100" height="38" rx="19" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="234" y="428" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="600">Failed</text>

  <rect x="716" y="286" width="104" height="38" rx="19" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="768" y="310" text-anchor="middle" fill="#7c2d12" font-size="12" font-weight="600">Expiring</text>

  <rect x="866" y="286" width="98" height="38" rx="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="915" y="310" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Deleted</text>

  <path d="M144,267 L178,267" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>
  <path d="M310,267 L386,267" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>
  <path d="M310,275 C350,275 352,345 386,345" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>
  <path d="M502,345 L536,345" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>
  <path d="M247,286 L247,398" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>
  <path d="M492,267 C640,267 660,305 710,305" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>
  <path d="M644,345 C680,345 690,315 710,308" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>
  <path d="M820,305 L860,305" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>

  <text x="330" y="240" fill="#64748b" font-size="9.5">on-demand</text>
  <text x="322" y="392" fill="#64748b" font-size="9.5">pooled</text>
  <text x="560" y="262" fill="#ea580c" font-size="9.5">TTL elapsed</text>

  <text x="700" y="380" fill="#334155" font-size="11" font-weight="600">health (free-form string)</text>
  <text x="700" y="396" fill="#475569" font-size="10">Healthy · Progressing · Degraded</text>
  <text x="700" y="414" fill="#334155" font-size="11" font-weight="600">Ready condition reasons</text>
  <text x="700" y="430" fill="#475569" font-size="10">from Flux, or TemplateNotFound · SourceError ·</text>
  <text x="700" y="443" fill="#475569" font-size="10">HelmReleaseError · NamespaceError · *TemplateError</text>

  <!-- gate from template -->
  <path d="M200,158 C200,190 200,220 220,242" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#sm-arrow)"/>
  <text x="212" y="196" fill="#2563eb" font-size="9.5" font-weight="600">gate: no HelmRelease until SourceReady</text>

  <!-- gaps -->
  <path d="M234,404 C300,404 640,404 690,398" stroke="#d97706" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#sm-warn)"/>
  <text x="300" y="462" fill="#b45309" font-size="10" font-weight="600">Failed sets health Degraded, Expiring sets Progressing — the phase and the summary agree</text>

  <!-- ============ DployInstanceClaim ============ -->
  <rect x="20" y="486" width="1200" height="196" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="512" fill="#0f172a" font-size="14" font-weight="700">DployInstanceClaim</text>
  <text x="196" y="512" fill="#64748b" font-size="10.5">phase · Bound and Ready conditions · mirrors the bound instance</text>

  <rect x="40" y="534" width="104" height="38" rx="19" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="92" y="558" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">Pending</text>

  <rect x="222" y="534" width="100" height="38" rx="19" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="272" y="558" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">Bound</text>

  <rect x="222" y="618" width="104" height="38" rx="19" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="274" y="642" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="600">Rejected</text>

  <rect x="424" y="534" width="102" height="38" rx="19" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="475" y="558" text-anchor="middle" fill="#7c2d12" font-size="12" font-weight="600">Expired</text>

  <path d="M144,553 L216,553" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>
  <path d="M322,553 L418,553" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>
  <path d="M100,572 C100,630 160,637 216,637" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#sm-arrow)"/>

  <text x="150" y="546" fill="#64748b" font-size="9.5">an instance is bound</text>
  <text x="338" y="546" fill="#ea580c" font-size="9.5">TTL elapsed</text>
  <text x="346" y="626" fill="#64748b" font-size="10">QuotaExceeded · TemplateAtCapacity ·</text>
  <text x="346" y="640" fill="#64748b" font-size="10">TemplateNotFound · TemplateDisabled</text>
  <text x="346" y="654" fill="#94a3b8" font-size="9.5">terminal until the spec changes; Expired is fully terminal</text>

  <text x="620" y="546" fill="#334155" font-size="11" font-weight="600">mirrored from the instance</text>
  <text x="620" y="562" fill="#475569" font-size="10">instancePhase · health · connectionURL · uuid</text>
  <text x="620" y="580" fill="#334155" font-size="11" font-weight="600">Pending reason</text>
  <text x="620" y="596" fill="#475569" font-size="10">PoolExhausted (waitForPool)</text>

  <path d="M272,534 C272,500 900,500 940,486" stroke="#64748b" stroke-width="1.3" fill="none" stroke-dasharray="4 3"/>
  <text x="880" y="478" fill="#64748b" font-size="9.5">projection</text>

  <rect x="900" y="530" width="304" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="916" y="550" fill="#92400e" font-size="10.5" font-weight="600">Failed instance -&gt; claim Rejected (InstanceFailed)</text>
  <text x="916" y="566" fill="#b45309" font-size="9.5">the instance is released, freeing the quota at once</text>
  <text x="916" y="579" fill="#b45309" font-size="9.5">remaining gap:</text>
  <text x="916" y="592" fill="#b45309" font-size="9.5">status.sync and status.extendCount are never written</text>
</svg>

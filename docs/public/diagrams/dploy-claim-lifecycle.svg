<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="DployInstanceClaim lifecycle. A new claim is Pending until the operator binds it, either to a warm pool member or to an instance provisioned on demand, at which point it becomes Bound and the TTL clock starts. A claim the operator cannot satisfy — the owner is over quota, or the template is unknown or disabled — becomes Rejected, which is terminal until the spec changes. When the TTL elapses the environment is torn down and the claim becomes Expired, a tombstone that no longer counts against the owner's quota. Deleting a Bound claim tears the environment down through the ownership cascade.">
  <defs>
    <marker id="cl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="cl-arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Pending -->
  <rect x="60" y="104" width="120" height="44" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="131" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Pending</text>

  <!-- Bound -->
  <rect x="360" y="104" width="120" height="44" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="131" text-anchor="middle" fill="#166534" font-size="13" font-weight="600">Bound</text>

  <!-- Expired -->
  <rect x="700" y="104" width="120" height="44" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="760" y="131" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="600">Expired</text>
  <text x="760" y="170" text-anchor="middle" fill="#9a3412" font-size="10.5">tombstone — frees the quota</text>

  <!-- Rejected -->
  <rect x="360" y="230" width="120" height="44" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="420" y="257" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="600">Rejected</text>
  <text x="496" y="257" fill="#b91c1c" font-size="10.5">terminal until the spec changes</text>

  <!-- Pending -> Bound -->
  <path d="M180,126 L358,126" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#cl-arrow)"/>
  <text x="269" y="98" text-anchor="middle" fill="#334155" font-size="11" font-weight="600">an instance is bound</text>
  <text x="269" y="170" text-anchor="middle" fill="#64748b" font-size="10.5">warm pool member, or on demand</text>

  <!-- Bound -> Expired -->
  <path d="M480,126 L698,126" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#cl-arrow)"/>
  <text x="589" y="98" text-anchor="middle" fill="#334155" font-size="11" font-weight="600">TTL elapsed</text>
  <text x="589" y="170" text-anchor="middle" fill="#64748b" font-size="10.5">the environment is torn down</text>

  <!-- Pending -> Rejected -->
  <path d="M120,148 L120,252 L358,252" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#cl-arrow)"/>
  <text x="132" y="212" fill="#64748b" font-size="10.5">over quota · unknown or</text>
  <text x="132" y="226" fill="#64748b" font-size="10.5">disabled template</text>

  <!-- Bound -> deleted by the user (ownership cascade) -->
  <path d="M420,104 L420,52" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cl-arrowDash)"/>
  <text x="434" y="70" fill="#64748b" font-size="10.5">delete the claim — it owns the instance,</text>
  <text x="434" y="84" fill="#64748b" font-size="10.5">so the environment goes with it</text>

  <!-- TTL anchor note -->
  <text x="420" y="196" text-anchor="middle" fill="#166534" font-size="10.5">the TTL clock starts at the binding, not at creation</text>
</svg>

# Ingresses for dev services that are not part of the Dploy chart.
# The Dploy API's own ingress comes from the chart (dev/values.yaml).
---
# Dex, served under the /dex path prefix because that is what its issuer says.
# Dex derives every endpoint it advertises in .well-known/openid-configuration
# from the issuer, so the path here and the path in dev/dex-values.yaml have to
# agree — otherwise discovery hands out URLs the ingress does not route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex
  namespace: dex
spec:
  ingressClassName: nginx
  rules:
    - host: auth.dploy.localhost
      http:
        paths:
          - path: /dex
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  number: 5556

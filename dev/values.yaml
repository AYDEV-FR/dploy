# Chart values for the local Kind cluster (dev/setup.sh).
#
# Only what differs from the chart defaults is set here: locally built images,
# and an auth block pointed at the dev Dex. The catalog, TTLs and quota the
# operator actually enforces live in dev/manifests/dploy.yaml — the values
# below are the API's own configuration and what the UI displays.

replicaCount: 1

image:
  repository: dploy-api
  tag: "local"
  pullPolicy: Never # built by dev/setup.sh and loaded into Kind

operator:
  enabled: true
  image:
    repository: dploy-operator
    tag: "local"
    pullPolicy: Never

config:
  # Empty means the release namespace (dploy-system), which is where
  # dev/manifests/dploy.yaml puts the templates.
  namespace: ""
  # Displayed in the UI; the enforced values are OperatorConfig.defaults.
  maxEnvironmentsPerUser: 3
  defaultTTL: 3600
  extendTTL: 1800
  catalogEnabled: true
  instancesListEnabled: true
  managerEnabled: true

auth:
  # Single issuer: Dex is configured with its public ingress URL, and CoreDNS
  # resolves that host to the ingress controller in-cluster too (dev/setup.sh),
  # so the API and the browser trust the exact same `iss`. oidcPublicIssuer is
  # therefore left empty — there is no split horizon to bridge.
  jwksURL: "http://auth.dploy.localhost/dex/keys"
  jwtIssuer: "http://auth.dploy.localhost/dex"
  jwtAudience: dploy
  # Dex's static password DB puts the `username` field in the `name` claim; it
  # does not issue preferred_username, which is the chart default.
  jwtUsernameClaim: name

  # Dex static passwords cannot carry a `groups` claim, so admin is matched on
  # the email instead — see the static users in dev/dex-values.yaml.
  adminClaim: email
  adminValue: "admin@dploy.localhost"

  oidcClientID: dploy
  oidcClientSecret: dploy-secret
  oidcIssuer: "http://auth.dploy.localhost/dex"
  oidcPublicIssuer: ""
  oidcRedirectURL: "http://dploy.localhost/auth/callback"

ingress:
  enabled: true
  className: nginx
  host: dploy.localhost

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

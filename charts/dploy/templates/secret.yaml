{{/*
Fail at render time rather than at runtime. Both values are required by the API
and have no sensible default, so without them the pod used to start, panic on
"JWKS_URL is required" and land in CrashLoopBackOff — with `--wait`, that turns
into "INSTALLATION FAILED: Deployment not ready" and a Go stack trace in a pod
log, which says nothing about what to set.

Only when the API is actually deployed: replicaCount 0 is how you install the
operator alone, and that install needs no identity provider at all.
*/}}
{{- if gt (int .Values.replicaCount) 0 }}
{{- $_ := required "auth.jwksURL is required: the API validates JWT signatures against this JWKS endpoint. Set it, or set replicaCount=0 to install the operator alone." .Values.auth.jwksURL }}
{{- $_ = required "auth.jwtIssuer is required: the API rejects tokens whose `iss` claim does not match. Set it, or set replicaCount=0 to install the operator alone." .Values.auth.jwtIssuer }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dploy.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dploy.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWKS_URL: {{ .Values.auth.jwksURL | quote }}
  JWT_ISSUER: {{ .Values.auth.jwtIssuer | quote }}
  {{- if .Values.auth.oidcIssuer }}
  OIDC_ISSUER: {{ .Values.auth.oidcIssuer | quote }}
  {{- end }}
  {{- if .Values.auth.oidcPublicIssuer }}
  OIDC_PUBLIC_ISSUER: {{ .Values.auth.oidcPublicIssuer | quote }}
  {{- end }}
  {{- if .Values.auth.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.auth.oidcClientSecret | quote }}
  {{- end }}

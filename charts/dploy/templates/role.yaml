{{/*
The API server validates the token, reads the catalog and writes environment
requests. Binding, TTL and teardown are the operator's decisions, so the API can
only *read* DployInstances — enough for the Manager UI's cluster-wide view, and
nothing more. It has no access at all to Flux, namespaces or workloads. A
namespaced Role is sufficient since the API operates in a single namespace.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dploy.fullname" . }}
  namespace: {{ include "dploy.namespace" . }}
  labels:
    {{- include "dploy.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - dploy.dev
    resources:
      - dploytemplates
      - dployinstances
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - dploy.dev
    resources:
      - dployinstanceclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

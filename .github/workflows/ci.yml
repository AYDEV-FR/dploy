name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: '1.26'
  # Run JS-based actions on Node 24 now (silences the Node 20 deprecation warning)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  # The CTFd plugin is the only Python in the repository, and it grew to the
  # size where "it imports, therefore it is fine" stopped being good enough.
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          src: integrations/ctfd_dploy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E (Kind + Flux)
    runs-on: ubuntu-latest
    # The suite this job runs is excluded from `go test ./...` by the e2e build
    # tag, and the envtest suite stubs the instance controller because envtest
    # has no Flux. Two production defects have already shipped through a fully
    # green CI for exactly that reason: nothing else here drives a real
    # HelmRelease, so nothing else can see them.
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: dploy-e2e
          wait: 120s

      - name: Install Flux
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
          flux install --components=source-controller,helm-controller
          kubectl -n flux-system rollout status deploy/source-controller --timeout=180s
          kubectl -n flux-system rollout status deploy/helm-controller --timeout=180s

      - name: Build and load the operator image
        run: |
          docker build -t dploy-operator:e2e -f Dockerfile.operator .
          kind load docker-image dploy-operator:e2e --name dploy-e2e

      - name: Install the CRDs and the operator
        run: |
          helm upgrade --install dploy ./charts/dploy \
            --namespace dploy-system --create-namespace \
            --set replicaCount=0 \
            --set operator.image.repository=dploy-operator \
            --set operator.image.tag=e2e \
            --set operator.image.pullPolicy=Never \
            --set auth.jwksURL=https://idp.invalid/jwks \
            --set auth.jwtIssuer=https://idp.invalid \
            --wait --timeout 5m
          kubectl -n dploy-system rollout status deploy/dploy-operator --timeout=180s

      - name: Run the e2e suite
        run: make test-e2e KUBECONTEXT=kind-dploy-e2e

      - name: Operator logs on failure
        if: failure()
        run: |
          kubectl -n dploy-system logs deploy/dploy-operator --tail=300 || true
          kubectl get dploytemplates,dployinstances,dployinstanceclaims -A -o wide || true
          kubectl get helmreleases,helmcharts,gitrepositories -A || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dploy-api-linux-amd64 ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dploy-api-linux-arm64 ./cmd/api
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dploy-api-darwin-amd64 ./cmd/api
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dploy-api-darwin-arm64 ./cmd/api

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dploy-api-*
          retention-days: 7
